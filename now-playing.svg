<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220">
  <defs>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2a63"/>
      <stop offset="1" stop-color="#1c1630"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0.5" y="0.5" width="839" height="219" rx="16" fill="#111018" stroke="#26232f"/>
  <rect x="0.5" y="0.5" width="839" height="219" rx="16" fill="url(#glow)"/>

  <!-- album art: a burger -->
  <rect x="30" y="30" width="160" height="160" rx="12" fill="url(#art)"/>
  <path d="M60,104 Q60,62 110,62 Q160,62 160,104 Z" fill="#f0a35e"/>
  <g fill="#fff3d6">
    <ellipse cx="90" cy="78" rx="3.5" ry="2" transform="rotate(-20 90 78)"/>
    <ellipse cx="110" cy="72" rx="3.5" ry="2"/>
    <ellipse cx="129" cy="80" rx="3.5" ry="2" transform="rotate(20 129 80)"/>
    <ellipse cx="100" cy="91" rx="3.5" ry="2" transform="rotate(10 100 91)"/>
    <ellipse cx="141" cy="95" rx="3.5" ry="2" transform="rotate(-15 141 95)"/>
    <ellipse cx="77" cy="95" rx="3.5" ry="2" transform="rotate(25 77 95)"/>
  </g>
  <path d="M56,103 H164 V108 Q158,117 152,108 Q146,117 140,108 Q134,117 128,108 Q122,117 116,108 Q110,117 104,108 Q98,117 92,108 Q86,117 80,108 Q74,117 68,108 Q62,117 56,108 Z" fill="#6fcf5e"/>
  <rect x="60" y="117" width="100" height="21" rx="10" fill="#6b3a24"/>
  <path d="M62,112 H158 V119 H128 L120,129 L112,119 H62 Z" fill="#f5d061"/>
  <path d="M62,141 H158 Q158,158 140,158 H80 Q62,158 62,141 Z" fill="#e08f48"/>

  <!-- equalizer -->
  <g fill="#a78bfa">
    <rect x="220" y="44" width="4" height="12" rx="1">
      <animate attributeName="height" values="4;14;7;12;4" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="52;42;49;44;52" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="227" y="44" width="4" height="12" rx="1">
      <animate attributeName="height" values="12;5;14;6;12" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="44;51;42;50;44" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="234" y="44" width="4" height="12" rx="1">
      <animate attributeName="height" values="7;13;4;10;7" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="49;43;52;46;49" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="241" y="44" width="4" height="12" rx="1">
      <animate attributeName="height" values="10;4;12;8;10" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="46;52;44;48;46" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="256" y="56" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#a78bfa">NOW PLAYING</text>

  <text x="220" y="106" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#f5f3ff">Yanis</text>
  <text x="220" y="136" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#a1a1b5">Discord bots · Node.js · TypeScript · France</text>

  <!-- progress bar -->
  <rect x="220" y="160" width="580" height="4" rx="2" fill="#2c2938"/>
  <rect x="220" y="160" width="0" height="4" rx="2" fill="#a78bfa">
    <animate attributeName="width" from="0" to="580" dur="40s" repeatCount="indefinite"/>
  </rect>
  <circle cx="220" cy="162" r="6" fill="#f5f3ff">
    <animate attributeName="cx" from="220" to="800" dur="40s" repeatCount="indefinite"/>
  </circle>
  <text x="220" y="188" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#6f6c80">hambot.fr</text>
  <text x="800" y="188" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#6f6c80">on repeat</text>
</svg>
